name: CI

on:
  push:
    branches: [main]
  pull_request:

# Vercel si occupa del deploy tramite l'integrazione GitHub: qui si verifica
# solo che il ramo sia sano. Se questo workflow fallisce, il deploy che parte
# in parallelo va considerato sospetto.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formattazione
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
